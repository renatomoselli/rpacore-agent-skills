name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  portable-skills:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate skills
        run: python scripts/validate_skills.py --repo-root .

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Build and check portable distribution
        run: |
          python scripts/package_skills.py build --repo-root . --profile portable --output validation-artifacts/portable --frozen
          python scripts/package_skills.py check --repo-root . --profile portable --output validation-artifacts/portable --frozen

      - name: Upload portable candidate
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: validation-artifacts/portable
          if-no-files-found: error

  cross-platform-assets:
    needs: portable-skills
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: portable-windows-latest
          path: validation-artifacts/portable-windows

      - name: Download Ubuntu candidate
        uses: actions/download-artifact@v4
        with:
          name: portable-ubuntu-latest
          path: validation-artifacts/portable-ubuntu

      - name: Compare all ten release asset hashes
        run: python scripts/package_skills.py compare --repo-root . --profile portable --first validation-artifacts/portable-windows --second validation-artifacts/portable-ubuntu

  pinned-core-baseline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Read the manifest-owned Core commit
        id: core
        run: python scripts/check_core_baseline.py core-ref --github-output

      - name: Check out the pinned Core baseline
        uses: actions/checkout@v7
        with:
          repository: renatomoselli/rpacore
          ref: ${{ steps.core.outputs.commit }}
          path: core-baseline
          token: ${{ secrets.RPACORE_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Validate immutable Core documentation targets
        run: python scripts/validate_skills.py --repo-root . --core-repo core-baseline

      - name: Verify reference consumers against the exact Core wheel
        run: python scripts/check_core_baseline.py verify --core-repo core-baseline
